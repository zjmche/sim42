[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distcalc"
version = "0.1.0"
description = "Pure-Python PR-EOS rigorous distillation calculator for ASU cryogenic columns"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["distcalc*"]

[tool.pytest.ini_options]
testpaths = ["distcalc/tests"]
addopts = "-v"

[tool.setuptools.package-data]
"distcalc.components" = ["components.json"]
"distcalc.tests.golden" = ["*.json"]
